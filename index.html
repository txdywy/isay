<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>iSay - P2P Voice Chat</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="sr-announcer" aria-live="assertive" aria-atomic="true" class="sr-only"></div>
  <div id="app">
    <!-- Landing -->
    <section id="screen-landing" class="screen active">
      <div class="container">
        <h1>iSay</h1>
        <p class="subtitle">Your room is ready. Share the link to start talking.</p>
        <div class="input-group">
          <input type="text" id="token-input" placeholder="Room name..." autocomplete="off" maxlength="32">
          <button id="btn-join">Connect</button>
        </div>
        <p class="hint">Auto-generated room name, edit if you like</p>
      </div>
    </section>

    <!-- Waiting / Connecting phases -->
    <section id="screen-waiting" class="screen">
      <div class="container">
        <div class="phase-indicator" id="phase-indicator">
          <div class="phase-step" data-phase="signaling">
            <div class="phase-dot"></div>
            <span>Signaling</span>
          </div>
          <div class="phase-line"></div>
          <div class="phase-step" data-phase="ice">
            <div class="phase-dot"></div>
            <span>ICE</span>
          </div>
          <div class="phase-line"></div>
          <div class="phase-step" data-phase="connected">
            <div class="phase-dot"></div>
            <span>Connected</span>
          </div>
        </div>
        <p class="subtitle" id="phase-label">Initializing...</p>

        <!-- QR code -->
        <div class="qr-section">
          <img id="qr-img" alt="QR code to join room" width="160" height="160">
          <p class="hint">Scan to join</p>
        </div>

        <!-- Share link -->
        <p class="subtitle">Or share this link:</p>
        <div class="share-link-box">
          <input type="text" id="share-link" readonly>
          <button id="btn-copy-link" title="Copy link" aria-label="Copy link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
        </div>
        <p class="hint" id="copy-hint"></p>
        <button id="btn-cancel-wait" class="btn-secondary">Cancel</button>
      </div>
    </section>

    <!-- Active call -->
    <section id="screen-call" class="screen">
      <div class="container">
        <div class="visualizer-wrap">
          <canvas id="visualizer" width="320" height="120"></canvas>
          <div class="visualizer-labels">
            <span id="label-local" class="user-label">You</span>
            <span id="label-remote" class="user-label">Peer</span>
          </div>
        </div>

        <div class="conn-bar" id="conn-bar">
          <div class="conn-badge" id="conn-type-badge">
            <span class="conn-icon" id="conn-icon">?</span>
            <span id="conn-type-text">Connecting</span>
          </div>
          <div class="conn-metrics">
            <div class="metric">
              <span class="metric-value" id="metric-latency">--</span>
              <span class="metric-label">ms</span>
            </div>
            <div class="metric-divider"></div>
            <div class="metric">
              <span class="metric-value" id="metric-jitter">--</span>
              <span class="metric-label">jitter</span>
            </div>
            <div class="metric-divider"></div>
            <div class="metric">
              <span class="metric-value" id="metric-loss">--</span>
              <span class="metric-label">loss</span>
            </div>
          </div>
        </div>

        <div class="quality-bar">
          <div class="quality-segments" id="quality-segments">
            <div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div>
          </div>
          <span class="quality-label" id="quality-label">--</span>
        </div>

        <h2 id="call-status-text">Connected</h2>
        <p class="subtitle" id="call-duration">00:00</p>

        <div class="controls" role="group" aria-label="Call controls">
          <button id="btn-mute" class="btn-control" title="Mute (Space)" aria-pressed="false" aria-label="Toggle microphone">
            <svg id="icon-mic-on" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
            <svg id="icon-mic-off" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
              <line x1="1" y1="1" x2="23" y2="23"/>
              <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/>
              <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2c0 .38-.03.75-.08 1.12"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
            <span id="mute-label">Mute</span>
          </button>
          <button id="btn-hangup" class="btn-control btn-danger" title="Hang up" aria-label="End call">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/>
              <line x1="23" y1="1" x2="1" y2="23"/>
            </svg>
            <span>Hang Up</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Disconnected -->
    <section id="screen-disconnected" class="screen">
      <div class="container">
        <h2>Call Ended</h2>
        <p class="subtitle" id="disconnect-reason">The call has ended</p>
        <button id="btn-restart">New Call</button>
      </div>
    </section>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").then((reg) => { reg.update(); });
    }
  </script>
</body>
</html>
